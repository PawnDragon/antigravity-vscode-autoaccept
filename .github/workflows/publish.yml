name: Publish to Visual Studio Marketplace
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Require public release identity
        run: node -e "const p=require('./package.json'); if(p.publisher==='securerag-local' || !p.repository?.url?.startsWith('https://github.com/')) { console.error('Configure your real publisher and GitHub repository first.'); process.exit(1); }"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run publish:marketplace
