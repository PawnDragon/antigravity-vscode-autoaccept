name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run package -- --baseContentUrl "https://github.com/${{ github.repository }}/blob/main" --baseImagesUrl "https://raw.githubusercontent.com/${{ github.repository }}/main"
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.os }}-node-${{ matrix.node }}
          path: dist/*.vsix
