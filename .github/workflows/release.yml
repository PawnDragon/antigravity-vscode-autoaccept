name: GitHub Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check release version
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) process.exit(1)"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run package -- --baseContentUrl "https://github.com/${{ github.repository }}/blob/main" --baseImagesUrl "https://raw.githubusercontent.com/${{ github.repository }}/main"
      - name: Attach VSIX to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.vsix --generate-notes
